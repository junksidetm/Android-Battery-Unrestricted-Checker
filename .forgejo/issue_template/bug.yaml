name: Bug Report
about: Create a report to help us improve
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: App & Android Version
      placeholder: e.g. v1.0.0, Android 15
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
