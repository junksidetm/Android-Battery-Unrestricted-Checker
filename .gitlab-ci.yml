# GitLab CI/CD Pipeline for Android Battery Unrestricted Checker
# Multi-platform deployment: Serves docs as GitLab Pages

image: alpine:latest

stages:
  - deploy

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
